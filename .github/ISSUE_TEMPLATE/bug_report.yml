name: Bug report
description: Report a reproducible problem in a published tool
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Portable Search MCP
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2.0.1"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Agent/client name and version. Remove private paths and identifiers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include which PASS checks appeared. Remove tokens, cookies, customer data, private paths, and sensitive search terms.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, customer data, private paths, and sensitive search terms.
          required: true
