name: Tool tests

on:
  push:
    paths:
      - "tools/portable-search-mcp/**"
      - ".github/workflows/tool-tests.yml"
  pull_request:
    paths:
      - "tools/portable-search-mcp/**"
      - ".github/workflows/tool-tests.yml"

permissions:
  contents: read

jobs:
  portable-search-mcp:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/portable-search-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/portable-search-mcp/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build allowlisted release
        run: python -m scripts.build_release
