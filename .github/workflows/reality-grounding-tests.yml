name: Reality Skills tests

on:
  push:
    branches:
      - "**"
    paths:
      - "tools/reality-grounding/**"
      - ".github/workflows/reality-grounding-tests.yml"
  pull_request:
    paths:
      - "tools/reality-grounding/**"
      - ".github/workflows/reality-grounding-tests.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/reality-grounding
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify bundled Skills
        run: python verify.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit public files
        run: python scripts/public_audit.py
      - name: Build release ZIP
        run: python scripts/build_release.py
