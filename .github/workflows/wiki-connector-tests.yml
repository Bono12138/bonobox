name: Wiki Connector tests

on:
  push:
    branches:
      - "**"
    paths:
      - "tools/wiki-connector/**"
      - ".github/workflows/wiki-connector-tests.yml"
  pull_request:
    paths:
      - "tools/wiki-connector/**"
      - ".github/workflows/wiki-connector-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: tools/wiki-connector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile wiki_connector.py
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
