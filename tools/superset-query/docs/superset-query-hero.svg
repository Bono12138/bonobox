<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BB箱子工具002：AI查询数据库，先走Superset</title>
  <desc id="desc">暖白背景上的深蓝工具卡，展示Agent经过Superset执行只读数据库查询的路径。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b3158" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a67"/>
      <stop offset="1" stop-color="#092a4b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#fffaf0"/>
  <circle cx="1100" cy="90" r="160" fill="#ffd91a" opacity="0.2"/>
  <circle cx="1080" cy="590" r="230" fill="#2f8b85" opacity="0.08"/>

  <g transform="translate(62 54)">
    <rect width="250" height="42" rx="21" fill="#ffd91a"/>
    <text x="125" y="28" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="700" fill="#112233">BonoBox · BB 箱子</text>
    <text x="0" y="82" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="20" font-weight="700" fill="#2f8b85" letter-spacing="2">工具 002 · 公开 BETA</text>

    <text x="0" y="178" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="66" font-weight="900" fill="#102c48">AI 查询数据库</text>
    <text x="0" y="258" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="66" font-weight="900" fill="#102c48">先走 Superset</text>

    <rect x="0" y="300" width="482" height="4" rx="2" fill="#ffd91a"/>
    <text x="0" y="350" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="25" font-weight="700" fill="#31526f">Windows · 只读 SQL · 本地凭据保护</text>
    <text x="0" y="394" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="22" fill="#587087">真实查询验证 · 错误分类 · 运行证据</text>

    <g transform="translate(0 440)">
      <rect width="356" height="58" rx="14" fill="#102c48"/>
      <text x="178" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">github.com/Bono12138/bonobox</text>
    </g>
  </g>

  <g transform="translate(620 90)" filter="url(#shadow)">
    <rect width="518" height="460" rx="34" fill="url(#panel)"/>
    <text x="42" y="58" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="18" font-weight="700" fill="#9bcac5" letter-spacing="2">一次受控的查询路径</text>

    <g transform="translate(50 100)">
      <rect width="126" height="112" rx="24" fill="#fffaf0"/>
      <circle cx="63" cy="42" r="21" fill="#ffd91a"/>
      <path d="M52 43h22M63 32v22" stroke="#102c48" stroke-width="7" stroke-linecap="round"/>
      <text x="63" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#102c48">Agent</text>
    </g>

    <path d="M184 156h62" stroke="#ffd91a" stroke-width="8" stroke-linecap="round"/>
    <path d="M236 143l18 13-18 13" fill="none" stroke="#ffd91a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(264 100)">
      <rect width="204" height="112" rx="24" fill="#ffffff"/>
      <path d="M18 38c0-10 14-18 32-18s32 8 32 18v36c0 10-14 18-32 18s-32-8-32-18z" fill="#2f8b85"/>
      <ellipse cx="50" cy="38" rx="32" ry="18" fill="#54aaa3"/>
      <text x="144" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#102c48">SUPERSET</text>
      <text x="144" y="78" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="700" fill="#587087">已有查询通道</text>
    </g>

    <g transform="translate(50 262)">
      <rect width="418" height="130" rx="24" fill="#0d4b7f" stroke="#2f6f9f" stroke-width="2"/>
      <g transform="translate(24 24)">
        <path d="M0 18c0-10 18-18 40-18s40 8 40 18v48c0 10-18 18-40 18S0 76 0 66z" fill="#ffd91a"/>
        <ellipse cx="40" cy="18" rx="40" ry="18" fill="#ffe66b"/>
        <path d="M17 43l14 14 32-34" fill="none" stroke="#102c48" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="138" y="54" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="25" font-weight="900" fill="#ffffff">只读数据库连接</text>
      <text x="138" y="91" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="18" fill="#c7e5e2">权限、日志和网络边界仍然有效</text>
    </g>
  </g>
</svg>
